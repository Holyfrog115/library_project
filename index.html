<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
    <script src="javascript.js" defer></script>
</head>
<body>
    <header>
        <h1>Library</h1>
    </header>
    <main>
        <div id="addButton">
            <button id="addBook">Add Book</button>
        </div>
        <ul class="collection">
        </ul>

        <dialog id="newBookDialog">
            <form id="newBookForm">
                <h2>New Book</h2>
                <div>
                    <div class="bookName">
                        <label for="bookName">Book Name: </label>
                        <input type="text" name="bookName" id="bookName" minlength="1" maxlength="255" required>
                    </div>
                    
                    <div class="bookAuthor">
                        <label for="author">Author: </label>
                        <input type="text" name="bookAuthor" id="author" minlength="1" maxlength="255" required>
                    </div>

                    <div class="bookYear">
                        <label for="year">Release Year: </label>
                        <input type="text" inputmode="numeric" name="bookYear" id="year" pattern="[0-9]{4}" maxlength="4" required>
                    </div>
                    
                    <div class="bookPages">
                        <label for="pages">Pages: </label>
                        <input type="number" name="bookPages" id="pages" min="1" max="99999" required>
                    </div>

                    <div class="readStatus">
                        <fieldset>
                            <legend>Have you read it?</legend>
                            <div class="readStatus">
                                <div>
                                    <input type="radio" name="readStatus" id="yes" value="yes">
                                    <label for="yes">Yes</label>
                                </div>
                                <div>
                                    <input type="radio" name="readStatus" id="no" value="no" checked>
                                    <label for="no">No</label>
                                </div>
                            </div>
                        </fieldset>
                        
                    </div>
                </div>
                <div>
                    <button type="button" id="cancelButton" value="cancel" formmethod="dialog" formnovalidate>Cancel</button>
                    <button id="addButton" value="default">Add Book</button>
                </div>
            </form>
        </dialog>
    </main>
    
</body>
</html>
