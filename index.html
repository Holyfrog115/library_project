<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
    <script src="javascript.js" defer></script>
</head>
<body>
    <header>
        <h1>Library</h1>
    </header>
    <main>
        <div>
            <button id="addBook">Add Book</button>
        </div>
        <ul class="collection">
        </ul>

        <dialog id="newBookDialog">
            <form>
                <h2>New Book</h2>
                <div>
                    <label for="bookName">Book Name: </label>
                    <input type="text" name="bookName" id="bookName">

                    <label for="author">Author: </label>
                    <input type="text" name="bookAuthor" id="author">

                    <label for="year">Release Year: </label>
                    <input type="text" inputmode="numeric" name="bookYear" id="year" pattern="[0-9]{4}" maxlength="4" required>

                    <label for="pages">Pages: </label>
                    <input type="text" inputmode="numeric" name="bookPages" id="pages">
                </div>
                <div>
                    <button value="cancel" formmethod="dialog">Cancel</button>
                    <button id="addButton" value="default">Add Book</button>
                </div>
                
            </form>

        </dialog>
    </main>
    
</body>
</html>
